<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <title>Zeitraffer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Zeitraffer</h1>
    <p id="stats" class="muted">Lade …</p>
  </header>

  <main>
    <section class="card">
      <h2>Heutiges Foto</h2>
      <p id="today-status" class="muted"></p>
      <div class="row">
        <button id="btn-camera" class="primary">📷 Kamera mit Ausrichtungshilfe</button>
        <label class="button">
          🖼 Fotos importieren
          <input id="file-input" type="file" accept="image/*" multiple hidden>
        </label>
      </div>
      <p class="hint">Tipp: Die Kamera blendet dein letztes Foto halbtransparent ein, damit du jedes Bild gleich ausrichten kannst – das macht das Morphing deutlich schöner.</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Fotos <span id="photo-count" class="muted"></span></h2>
      </div>
      <div id="gallery" class="gallery"></div>
      <p id="gallery-empty" class="muted" hidden>Noch keine Fotos. Nimm dein erstes Foto auf!</p>
    </section>

    <section class="card">
      <h2>Video erstellen</h2>
      <form id="video-form" class="settings">
        <label>Format
          <select name="format">
            <option value="auto">Automatisch (wie erstes Foto)</option>
            <option value="1280x720">1280 × 720 Querformat</option>
            <option value="1920x1080">1920 × 1080 Querformat</option>
            <option value="720x1280">720 × 1280 Hochformat</option>
            <option value="1080x1920">1080 × 1920 Hochformat</option>
            <option value="1080x1080">1080 × 1080 Quadrat</option>
          </select>
        </label>
        <label>Bildausschnitt
          <select name="fit">
            <option value="cover">Füllen (zuschneiden)</option>
            <option value="contain">Einpassen (Balken)</option>
          </select>
        </label>
        <label>Standzeit pro Foto <output name="holdOut"></output>
          <input type="range" name="holdSec" min="0" max="2" step="0.05" value="0.25">
        </label>
        <label>Übergangsdauer <output name="transOut"></output>
          <input type="range" name="transSec" min="0.1" max="3" step="0.05" value="0.8">
        </label>
        <label>Morph-Stärke <output name="strengthOut"></output>
          <input type="range" name="strength" min="0" max="1.5" step="0.05" value="1">
        </label>
        <label>Bilder pro Sekunde
          <select name="fps">
            <option value="24">24</option>
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </label>
        <label>Von <input type="date" name="from"></label>
        <label>Bis <input type="date" name="to"></label>
        <label class="check"><input type="checkbox" name="showDate" checked> Datum einblenden</label>
      </form>

      <p id="video-summary" class="muted"></p>
      <div class="row">
        <button id="btn-preview">▶ Vorschau</button>
        <button id="btn-render" class="primary">🎬 Video erstellen</button>
        <button id="btn-cancel" hidden>Abbrechen</button>
      </div>

      <div id="render-area" hidden>
        <progress id="progress" max="1" value="0"></progress>
        <p id="render-status" class="muted"></p>
        <canvas id="stage"></canvas>
      </div>

      <div id="result" hidden>
        <video id="result-video" controls playsinline loop></video>
        <div class="row">
          <a id="download" class="button primary" download>⬇ Video herunterladen</a>
          <button id="btn-share" hidden>Teilen</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="camera-dialog" class="camera-dialog">
    <div id="cam-stage" class="cam-stage">
      <video id="cam-video" autoplay playsinline muted></video>
      <img id="cam-ghost" alt="">
    </div>
    <div class="cam-controls">
      <label class="ghost-control">Overlay
        <input id="cam-ghost-opacity" type="range" min="0" max="0.8" step="0.05" value="0.35">
      </label>
      <div class="row">
        <button id="cam-close">Abbrechen</button>
        <button id="cam-switch">🔄</button>
        <button id="cam-shoot" class="primary shoot" aria-label="Foto aufnehmen"></button>
      </div>
    </div>
  </dialog>

  <dialog id="photo-dialog" class="photo-dialog">
    <img id="photo-full" alt="">
    <form method="dialog" class="photo-form">
      <label>Datum <input id="photo-date" type="date" required></label>
      <div class="row">
        <button value="delete" class="danger">Löschen</button>
        <button value="cancel">Schließen</button>
        <button value="save" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
